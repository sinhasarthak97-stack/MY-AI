<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY. Ai</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14213d;--mute:#5b6677;--line:#d5dbe4;--acc:#2f5bff;--accink:#fff;--me:#dfe7ff}
@media (prefers-color-scheme:dark){:root{--bg:#0e131c;--panel:#161d29;--ink:#e6ebf5;--mute:#8b97ab;--line:#263042;--acc:#6f8cff;--accink:#0e131c;--me:#1e2a4a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0 auto 0 0}
select,input[type=text],textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button.go{background:var(--acc);color:var(--accink);border-color:var(--acc)}
label{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px}
#log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,92%);padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--me)}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.note{align-self:center;color:var(--mute);font-size:14px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre;margin:8px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
footer{display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
textarea{flex:1;resize:none;min-height:44px;max-height:160px}
#cfg{display:none;width:100%;gap:8px;align-items:center;flex-wrap:wrap}
#cfg.open{display:flex}
#cfg input{flex:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>MY. Ai</h1>
  <select id="model" aria-label="Model"></select>
  <label><input type="checkbox" id="searchOn"> Web search</label>
  <button id="gear" title="Settings">Settings</button>
  <button id="clear">New chat</button>
  <div id="cfg">
    <label for="srv">Model server</label>
    <input type="text" id="srv" placeholder="http://192.168.1.5:11434">
    <label for="searx">Search server</label>
    <input type="text" id="searx" placeholder="http://localhost:8080">
  </div>
</header>
<div id="log"></div>
<footer>
  <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
  <button class="go" id="send">Send</button>
</footer>

<script>
let OLLAMA = load('ollama', 'http://localhost:11434');
const SYSTEM = 'You are a capable, direct assistant. Answer clearly. Say when you are unsure.';
const $ = s => document.querySelector(s);
const log = $('#log'), input = $('#input'), sendBtn = $('#send');
let chat = [], ctrl = null;

function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function esc(t){ return t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(t){
  return esc(t)
    .replace(/```(?:\w+)?\n?([\s\S]*?)(```|$)/g, (_, c) => '<pre><code>' + c + '</code></pre>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
}
function bubble(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = fmt(text);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function note(text){
  const d = document.createElement('div');
  d.className = 'note'; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function loadModels(){
  const sel = $('#model');
  try {
    const r = await fetch(OLLAMA + '/api/tags');
    const j = await r.json();
    sel.innerHTML = '';
    j.models.forEach(m => sel.add(new Option(m.name, m.name)));
    if (!j.models.length) note('No models installed. Run: ollama pull llama3.1');
    const last = load('model', '');
    if (last) sel.value = last;
  } catch(e){
    note('Cannot reach Ollama at ' + OLLAMA + '. Start it, and set OLLAMA_ORIGINS=* if you open this file directly.');
  }
}

async function webSearch(q){
  const base = $('#searx').value.trim().replace(/\/$/, '');
  const r = await fetch(base + '/search?format=json&q=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return j.results.slice(0, 5).map((x, i) => `[${i+1}] ${x.title} (${x.url})\n${x.content || ''}`).join('\n\n');
}

async function send(){
  if (ctrl) { ctrl.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  chat.push({role: 'user', content: text});
  bubble('user', text);

  let ctx = '';
  if ($('#searchOn').checked && $('#searx').value.trim()) {
    try { ctx = await webSearch(text); } catch(e){ note('Search failed: ' + e.message); }
  }
  const sys = SYSTEM + (ctx ? '\n\nUse these web results and cite them like [1], [2]:\n' + ctx : '');
  const out = bubble('ai', '…');
  let reply = '';
  ctrl = new AbortController();
  sendBtn.textContent = 'Stop';
  try {
    const r = await fetch(OLLAMA + '/api/chat', {
      method: 'POST', signal: ctrl.signal,
      body: JSON.stringify({model: $('#model').value, stream: true, messages: [{role: 'system', content: sys}, ...chat]})
    });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.trim()) continue;
        const j = JSON.parse(ln);
        if (j.message) { reply += j.message.content; out.innerHTML = fmt(reply); log.scrollTop = log.scrollHeight; }
      }
    }
  } catch(e){
    if (e.name !== 'AbortError') out.textContent = 'Error: ' + e.message;
  }
  if (reply) chat.push({role: 'assistant', content: reply});
  ctrl = null; sendBtn.textContent = 'Send';
}

$('#model').onchange = e => save('model', e.target.value);
$('#gear').onclick = () => $('#cfg').classList.toggle('open');
$('#srv').value = OLLAMA;
$('#srv').onchange = e => { OLLAMA = e.target.value.trim().replace(/\/$/, ''); save('ollama', OLLAMA); loadModels(); };
$('#searx').value = load('searx', '');
$('#searx').onchange = e => save('searx', e.target.value);
$('#clear').onclick = () => { if (ctrl) ctrl.abort(); chat = []; log.innerHTML = ''; };
sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
loadModels();
</script>
</body>
</html>
